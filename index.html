<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Design Final Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Responsive & Accessible Gallery</h1>
    </header>

    <main class="container">
        <!-- Thay thế toàn bộ ảnh và văn bản theo yêu cầu 1 & 2 -->
        <figure>
            <img src="images/photo1.jpg" alt="A serene mountain landscape during sunset">
            <figcaption>
                <p>Exploring the majestic mountain ranges during early twilight hours provides a breathtaking perspective on nature's solitude.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/photo2.jpg" alt="A quiet forest path covered with autumn leaves">
            <figcaption>
                <p>Walking along a peaceful path through the autumn forest reveals vibrant hues of gold, orange, and crimson foliage.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/photo3.jpg" alt="Calm ocean waves crashing gently onto a sandy beach">
            <figcaption>
                <p>The rhythmic soothing sound of ocean waves rolling onto the shore offers a tranquil escape from busy urban life.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/photo4.jpg" alt="A modern city skyline illuminated at night">
            <figcaption>
                <p>Metropolitan areas come alive after dark, showcasing impressive architectural structures glowing under city lights.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/photo5.jpg" alt="A close-up view of fresh morning dew drops on a green leaf">
            <figcaption>
                <p>Intricate details of nature can be observed up close, such as delicate water droplets resting gently on a leaf surface.</p>
            </figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2026 Responsive Web Design Project. All rights reserved.</p>
    </footer>

</body>
</html>
